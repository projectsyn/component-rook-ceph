applications:
  - prometheus

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-storageclass/v1.0.0/lib/storageclass.libsonnet
        output_path: vendor/lib/storageclass.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus-alert-patching.libsonnet
        output_path: vendor/lib/alert-patching.libsonnet

  storageclass:
    defaults: {}
    defaultClass: ""

  rook_ceph:
    ceph_cluster:
      rbd_enabled: false
      cephfs_enabled: true

  prometheus:
    alerts:
      ignoreNames: []
